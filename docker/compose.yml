name: finance-os

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MIGRATION_PREVIEW_SECRET: ${MIGRATION_PREVIEW_SECRET:?MIGRATION_PREVIEW_SECRET must be set}
      FINANCE_IMPORT_CONFIRM_TOKEN_SECRET: ${FINANCE_IMPORT_CONFIRM_TOKEN_SECRET:?FINANCE_IMPORT_CONFIRM_TOKEN_SECRET must be set}
      FINANCE_IMPORT_STORAGE_RAW_ROOT: /var/lib/finance-os-import/raw
      FINANCE_IMPORT_STORAGE_PLAN_ROOT: /var/lib/finance-os-import/plan
      FINANCE_IMPORT_STORAGE_DEPLOYMENT_ID: ${FINANCE_IMPORT_STORAGE_DEPLOYMENT_ID:?FINANCE_IMPORT_STORAGE_DEPLOYMENT_ID must be set}
      FINANCE_IMPORT_STORAGE_RAW_ID: ${FINANCE_IMPORT_STORAGE_RAW_ID:?FINANCE_IMPORT_STORAGE_RAW_ID must be set}
      FINANCE_IMPORT_STORAGE_PLAN_ID: ${FINANCE_IMPORT_STORAGE_PLAN_ID:?FINANCE_IMPORT_STORAGE_PLAN_ID must be set}
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-false}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_USER_REQUEST_LIMIT_PER_MINUTE: ${MARKET_DATA_USER_REQUEST_LIMIT_PER_MINUTE:-10}
      MARKET_DATA_PROVIDER_REQUEST_LIMIT_PER_MINUTE: ${MARKET_DATA_PROVIDER_REQUEST_LIMIT_PER_MINUTE:-8}
    volumes:
      - import_storage:/var/lib/finance-os-import
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  frontend:
    build:
      context: ../frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT must be set}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  import-storage-provision:
    profiles: ["import-provision"]
    build:
      context: ../backend
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        java -Dloader.main=com.financeos.module.importing.storage.ImportStorageProvisioner
        -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher --provision
        && chown -R financeos:financeos /var/lib/finance-os-import/raw /var/lib/finance-os-import/plan
    environment:
      FINANCE_IMPORT_STORAGE_RAW_ROOT: /var/lib/finance-os-import/raw
      FINANCE_IMPORT_STORAGE_PLAN_ROOT: /var/lib/finance-os-import/plan
      FINANCE_IMPORT_STORAGE_DEPLOYMENT_ID: ${FINANCE_IMPORT_STORAGE_DEPLOYMENT_ID:?FINANCE_IMPORT_STORAGE_DEPLOYMENT_ID must be set}
      FINANCE_IMPORT_STORAGE_RAW_ID: ${FINANCE_IMPORT_STORAGE_RAW_ID:?FINANCE_IMPORT_STORAGE_RAW_ID must be set}
      FINANCE_IMPORT_STORAGE_PLAN_ID: ${FINANCE_IMPORT_STORAGE_PLAN_ID:?FINANCE_IMPORT_STORAGE_PLAN_ID must be set}
    volumes:
      - import_storage:/var/lib/finance-os-import

volumes:
  postgres_data:
  import_storage:
