name: CI

on:
  push:
    branches: [zh-cn]
  pull_request:
    branches: [zh-cn]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Build and verify fixed historical V19 application
        shell: bash
        run: |
          set -euo pipefail
          historical_commit=7d2d83c23abeaa64f0f5854f729ea919509b551a
          historical_root="$(mktemp -d "$RUNNER_TEMP/finance-os-v19.XXXXXX")"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$historical_commit"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$historical_commit:backend")" = '7a5eb4e71c9f44724317e1814fb18e873ad3bd03'
          git -C "$GITHUB_WORKSPACE" archive --format=tar --output="$historical_root/source.tar" "$historical_commit" backend
          mkdir "$historical_root/source"
          tar -xf "$historical_root/source.tar" -C "$historical_root/source"
          (
            cd "$historical_root/source/backend"
            bash ./mvnw -B -DskipTests package
          )
          java "$GITHUB_WORKSPACE/backend/src/test/java/com/financeos/integration/historical/HistoricalV19Artifact.java" \
            "$GITHUB_WORKSPACE" "$historical_root/source/backend" \
            "$historical_root/source/backend/target/finance-os-backend-1.0.0.jar" "$historical_root/identity.properties"
          {
            echo "FINANCE_OS_V19_IDENTITY=$historical_root/identity.properties"
            echo "FINANCE_OS_B2_EVIDENCE_ROOT=$historical_root"
          } >> "$GITHUB_ENV"
      - name: Run backend tests
        run: ./mvnw -B clean test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  ai-e2e:
    name: AI Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run AI browser contract Playwright E2E
        run: npm run test:e2e:ai
      - name: Upload AI E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ai-e2e-failure-diagnostics
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPRING_PROFILES_ACTIVE: e2e
      E2E_BACKEND_PORT: 8081
      E2E_DB_USERNAME: finance_os_e2e
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Generate isolated E2E secrets
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -base64 48)"
          migration_secret="$(openssl rand -base64 48)"
          import_secret="$(openssl rand -base64 48)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$migration_secret"
          echo "::add-mask::$import_secret"
          {
            echo "E2E_DB_PASSWORD=$db_password"
            echo "E2E_JWT_SECRET=$jwt_secret"
            echo "E2E_MIGRATION_PREVIEW_SECRET=$migration_secret"
            echo "FINANCE_IMPORT_CONFIRM_TOKEN_SECRET=$import_secret"
          } >> "$GITHUB_ENV"
      - name: Start isolated E2E PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          command -v psql > /dev/null
          db_owner="$(cat /proc/sys/kernel/random/uuid)"
          db_container="finance-os-e2e-pg-$db_owner"
          {
            echo "E2E_DB_CONTAINER=$db_container"
            echo "E2E_DB_CONTAINER_OWNER=$db_owner"
          } >> "$GITHUB_ENV"
          POSTGRES_PASSWORD="$E2E_DB_PASSWORD" docker run --detach --name "$db_container" \
            --label "finance-os.e2e-owner=$db_owner" \
            --publish 127.0.0.1:5432:5432 \
            --tmpfs /var/lib/postgresql/data \
            --env POSTGRES_DB=finance_os_e2e --env "POSTGRES_USER=$E2E_DB_USERNAME" \
            --env POSTGRES_PASSWORD --env POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            --env 'POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256' \
            postgres:17-alpine
          for attempt in {1..60}; do
            test "$(docker inspect --format '{{.State.Running}}' "$db_container")" = 'true'
            if docker exec "$db_container" pg_isready --host=127.0.0.1 \
              --username="$E2E_DB_USERNAME" --dbname=finance_os_e2e > /dev/null 2>&1; then
              database_name="$(PGPASSWORD="$E2E_DB_PASSWORD" PGCONNECT_TIMEOUT=5 \
                psql -X --no-password --set=ON_ERROR_STOP=1 --no-align --tuples-only \
                --host=127.0.0.1 --port=5432 --dbname=finance_os_e2e \
                --username="$E2E_DB_USERNAME" --command='SELECT current_database();')"
              test "$database_name" = 'finance_os_e2e'
              echo 'Isolated E2E PostgreSQL ready; authenticated database identity verified.'
              exit 0
            fi
            sleep 2
          done
          echo '::error::Isolated E2E PostgreSQL did not become ready.'
          exit 1
      - name: Prepare isolated E2E import storage
        run: |
          umask 077
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          test "$(realpath -e "$RUNNER_TEMP")" = "$RUNNER_TEMP"
          storage_parent="$(mktemp -d "$RUNNER_TEMP/finance-os-e2e-import.XXXXXXXXXX")"
          test "$(stat -c '%a:%u' "$storage_parent")" = "700:$(id -u)"
          raw_root="$storage_parent/raw"
          plan_root="$storage_parent/plan"
          mkdir -m 700 "$raw_root" "$plan_root"
          for root in "$raw_root" "$plan_root"; do
            test ! -L "$root"
            test "$(realpath -e "$root")" = "$root"
          done
          deployment_id="$(cat /proc/sys/kernel/random/uuid)"
          raw_id="$(cat /proc/sys/kernel/random/uuid)"
          plan_id="$(cat /proc/sys/kernel/random/uuid)"
          test "$raw_id" != "$plan_id"
          {
            echo "FINANCE_IMPORT_STORAGE_RAW_ROOT=$raw_root"
            echo "FINANCE_IMPORT_STORAGE_PLAN_ROOT=$plan_root"
            echo "FINANCE_IMPORT_STORAGE_DEPLOYMENT_ID=$deployment_id"
            echo "FINANCE_IMPORT_STORAGE_RAW_ID=$raw_id"
            echo "FINANCE_IMPORT_STORAGE_PLAN_ID=$plan_id"
          } >> "$GITHUB_ENV"
      - name: Build current E2E backend JAR
        working-directory: backend
        run: |
          chmod +x mvnw
          source_head="$(git rev-parse HEAD)"
          ./mvnw -B clean package -DskipTests
          test "$(git rev-parse HEAD)" = "$source_head"
          jar_path="$GITHUB_WORKSPACE/backend/target/finance-os-backend-1.0.0.jar"
          test -s "$jar_path"
          jar tf "$jar_path" > "$RUNNER_TEMP/e2e-backend-jar-entries.txt"
          grep -Fx 'BOOT-INF/classes/com/financeos/FinanceOsApplication.class' "$RUNNER_TEMP/e2e-backend-jar-entries.txt"
          grep -Fx 'BOOT-INF/classes/com/financeos/module/importing/storage/ImportStorageProvisioner.class' "$RUNNER_TEMP/e2e-backend-jar-entries.txt"
          grep -Fx 'org/springframework/boot/loader/launch/PropertiesLauncher.class' "$RUNNER_TEMP/e2e-backend-jar-entries.txt"
          grep -Fx 'org/springframework/boot/loader/launch/JarLauncher.class' "$RUNNER_TEMP/e2e-backend-jar-entries.txt"
          echo "E2E backend JAR built from $source_head"
          sha256sum "$jar_path"
      - name: Provision E2E import storage
        working-directory: backend
        run: |
          umask 077
          java -Dloader.main=com.financeos.module.importing.storage.ImportStorageProvisioner \
            -cp target/finance-os-backend-1.0.0.jar \
            org.springframework.boot.loader.launch.PropertiesLauncher --provision
          for root in "$FINANCE_IMPORT_STORAGE_RAW_ROOT" "$FINANCE_IMPORT_STORAGE_PLAN_ROOT"; do
            test ! -L "$root"
            test "$(realpath -e "$root")" = "$root"
            test "$(stat -c '%a:%u' "$root")" = "700:$(id -u)"
            for binding in .import-binding .import-control; do
              test -f "$root/$binding"
              test ! -L "$root/$binding"
              test "$(stat -c '%a:%u' "$root/$binding")" = "600:$(id -u)"
            done
          done
      - name: Start E2E backend
        working-directory: backend
        run: |
          chmod +x mvnw
          setsid ./mvnw -B spring-boot:run > "$GITHUB_WORKSPACE/backend-e2e.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend-e2e.pid"
          for attempt in {1..60}; do
            backend_pid="$(cat "$GITHUB_WORKSPACE/backend-e2e.pid")"
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "E2E backend exited before becoming ready."
              cat "$GITHUB_WORKSPACE/backend-e2e.log"
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:8081/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/backend-e2e.log"
          exit 1
      - name: Verify E2E Flyway V21
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql > /dev/null; then
            echo '::error::PostgreSQL client psql is unavailable.'
            exit 1
          fi
          export PGPASSWORD="$E2E_DB_PASSWORD"
          export PGCONNECT_TIMEOUT=10
          export PGOPTIONS='-c default_transaction_read_only=on'
          psql_command=(psql -X --no-password --set=ON_ERROR_STOP=1 --no-align --tuples-only
            --host=127.0.0.1 --port=5432 --dbname=finance_os_e2e --username="$E2E_DB_USERNAME")
          database_name="$("${psql_command[@]}" --command='SELECT current_database();')"
          test "$database_name" = 'finance_os_e2e'
          failed_migrations="$("${psql_command[@]}" --command='
            SELECT COUNT(*) FROM public.flyway_schema_history WHERE success = FALSE;')"
          test "$failed_migrations" = '0'
          latest_version="$("${psql_command[@]}" --command='
            SELECT version
            FROM public.flyway_schema_history
            WHERE success = TRUE
              AND version IS NOT NULL
            ORDER BY installed_rank DESC
            LIMIT 1;')"
          test "$latest_version" = '21'
          echo "E2E Flyway verified: V$latest_version; no failed migrations."
      - name: Start E2E frontend
        working-directory: frontend
        run: |
          setsid env VITE_API_PROXY_TARGET=http://127.0.0.1:8081 npm run dev -- --host 127.0.0.1 --port 5180 > "$GITHUB_WORKSPACE/frontend-e2e.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/frontend-e2e.pid"
          for attempt in {1..30}; do
            frontend_pid="$(cat "$GITHUB_WORKSPACE/frontend-e2e.pid")"
            if ! kill -0 "$frontend_pid" 2>/dev/null; then
              echo "E2E frontend exited before becoming ready."
              cat "$GITHUB_WORKSPACE/frontend-e2e.log"
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:5180 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/frontend-e2e.log"
          exit 1
      - name: Run Investment Command Playwright E2E
        working-directory: frontend
        run: E2E_BASE_URL=http://127.0.0.1:5180 npm run test:e2e:investment-command
      - name: Run Transaction Import browser contract Playwright E2E
        working-directory: frontend
        run: npm run test:e2e:transaction-import
      - name: Run Transaction Import real backend Playwright E2E
        working-directory: frontend
        run: E2E_BASE_URL=http://127.0.0.1:5180 npm run test:e2e:transaction-import:real
      - name: Print E2E service logs
        if: failure()
        run: |
          echo '--- backend-e2e.log ---'
          if [ -f "$GITHUB_WORKSPACE/backend-e2e.log" ]; then cat "$GITHUB_WORKSPACE/backend-e2e.log"; fi
          echo '--- frontend-e2e.log ---'
          if [ -f "$GITHUB_WORKSPACE/frontend-e2e.log" ]; then cat "$GITHUB_WORKSPACE/frontend-e2e.log"; fi
      - name: Print E2E PostgreSQL failure logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${E2E_DB_CONTAINER:-}" ]; then
            db_id="$(docker container ls --all --filter "name=^/$E2E_DB_CONTAINER$" --format '{{.ID}}')"
            if [ -n "$db_id" ]; then
              test "$(docker inspect --format '{{ index .Config.Labels "finance-os.e2e-owner" }}' "$db_id")" = "$E2E_DB_CONTAINER_OWNER"
              docker logs --tail 100 "$db_id"
            fi
          fi
      - name: Stop E2E services
        if: always()
        run: |
          stop_process_group() {
            local pid_file="$1"
            if [ ! -f "$pid_file" ]; then return; fi
            local pid
            pid="$(cat "$pid_file")"
            if kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" || true
              for attempt in {1..10}; do
                if ! kill -0 "$pid" 2>/dev/null; then return; fi
                sleep 1
              done
              kill -KILL -- "-$pid" || true
            fi
          }
          stop_process_group "$GITHUB_WORKSPACE/frontend-e2e.pid"
          stop_process_group "$GITHUB_WORKSPACE/backend-e2e.pid"
      - name: Stop E2E PostgreSQL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${E2E_DB_CONTAINER:-}" ]; then
            db_id="$(docker container ls --all --filter "name=^/$E2E_DB_CONTAINER$" --format '{{.ID}}')"
            if [ -n "$db_id" ]; then
              test "$(docker inspect --format '{{ index .Config.Labels "finance-os.e2e-owner" }}' "$db_id")" = "$E2E_DB_CONTAINER_OWNER"
              docker stop --time 10 "$db_id" > /dev/null
              docker rm --volumes "$db_id" > /dev/null
            fi
          fi

  deployment:
    name: Deployment artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build -t finance-os-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t finance-os-frontend:ci ./frontend
      - name: Validate Compose configuration
        run: docker compose --env-file docker/.env.example -f docker/compose.yml config
