spring:
  application:
    name: finance-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_os}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

market-data:
  enabled: ${MARKET_DATA_ENABLED:false}
  api-key: ${MARKET_DATA_API_KEY:}
  provider: TWELVE_DATA
  connect-timeout: 2s
  read-timeout: 5s
  cache-ttl: 15m
  user-request-limit-per-minute: ${MARKET_DATA_USER_REQUEST_LIMIT_PER_MINUTE:10}
  provider-request-limit-per-minute: ${MARKET_DATA_PROVIDER_REQUEST_LIMIT_PER_MINUTE:8}

fx-data:
  enabled: ${FX_DATA_ENABLED:false}
  provider: ${FX_DATA_PROVIDER:}
  base-url: ${FX_DATA_BASE_URL:}
  api-key: ${FX_DATA_API_KEY:}
  connect-timeout: 2s
  read-timeout: 5s

server:
  port: 8080

logging:
  level:
    com.financeos: INFO
