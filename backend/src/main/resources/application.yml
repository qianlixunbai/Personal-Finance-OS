spring:
  application:
    name: finance-os
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_os
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: finance-os-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000

server:
  port: 8080

logging:
  level:
    com.financeos: INFO
